<script>
  const GAS_URL = "ここにGASのURL/exec";
  let currentItemId = "";
  let currentItemName = "";

  window.addEventListener('DOMContentLoaded', () => {
    // 1. URLのパラメータ（?itemId=...）から食材IDを取得
    const urlParams = new URLSearchParams(window.location.search);
    currentItemId = urlParams.get('itemId') || "未指定";

    // 2. LIFF初期化
    liff.init({ liffId: "2011092393-SgriYaD6" })
      .then(() => {
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          liff.getProfile().then(profile => {
            document.getElementById('statusText').textContent = profile.displayName + " 様";
            document.getElementById('userName').value = profile.displayName;
            document.getElementById('userId').value = profile.userId;

            // 3. 食材IDから食材名を取得する（GAS側の getItemNameById を呼び出すか、直書き）
            // 例: itemId が指定されている場合
            if (currentItemId !== "未指定") {
              fetch(`${GAS_URL}?action=getItemName&itemId=${currentItemId}`)
                .then(res => res.json())
                .then(data => {
                  currentItemName = data.itemName;
                  document.getElementById('itemNameDisplay').textContent = currentItemName;
                });
            }

            document.getElementById('submitBtn').disabled = false;
          });
        }
      });
  });

// フォーム送信処理
document.getElementById('applyForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = "送信中...";

  // 画面の入力値（またはURLパラメータ等）からセット
  const payload = {
    userId: document.getElementById('userId').value,
    userName: document.getElementById('userName').value,
    itemId: document.getElementById('itemId').value,     // 画面で選ばれた食材ID
    itemName: document.getElementById('itemName').value, // 画面で選ばれた食材名
    quantity: document.getElementById('quantity').value
  };

  fetch(GAS_URL, {
    method: "POST",
    body: JSON.stringify(payload)
  })
  .then(res => res.json())
  .then(data => {
    alert("申込みが完了しました！");
    liff.closeWindow(); // LINE画面を閉じる
  })
  .catch(err => {
    alert("送信が完了しました");
    liff.closeWindow();
  });
});</script>
