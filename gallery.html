<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みんなのおかずギャラリー</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f9fa;
            color: #333;
            margin: 0;
            padding: 16px;
        }
        h1 {
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #d97706;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #eee;
        }
        .card-content {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }
        .meta-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #666;
        }
        .nickname {
            font-weight: bold;
            color: #333;
        }
        .food-badge {
            background: #fef3c7;
            color: #92400e;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            align-self: flex-start;
        }
        .comment-box {
            background: #f9fafb;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        .comment-title {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 2px;
        }
        .ai-comment {
            background: #ecfdf5;
            color: #065f46;
            border-left: 3px solid #10b981;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>

    <h1>🍳 みんなのおかずギャラリー</h1>
    <div id="loading" class="loading">データを読み込んでいます...</div>
    <div id="gallery" class="gallery-grid"></div>
    <script>
        // デプロイしたGASのWebアプリURLに ?action=gallery をつなげたもの
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyIDAicNzmDWMMyQLk7qXateXItDN62NLq27WIWwFivnWHtEsJPHeLNL58z9qTkF7na/exec?action=gallery";

        async function fetchGalleryData() {
            const galleryEl = document.getElementById("gallery");
            const loadingEl = document.getElementById("loading");
            
            try {
                // ① 通信開始のログを画面に出す
                if (loadingEl) loadingEl.textContent = "GASへ接続中...";
                
                const response = await fetch(GAS_API_URL);
                
                // ② ステータスコードの確認
                if (!response.ok) {
                    throw new Error(`サーバーエラー: ${response.status} ${response.statusText}`);
                }
                
                if (loadingEl) loadingEl.textContent = "データを解析中...";
                const data = await response.json();
                
                if (loadingEl) loadingEl.style.display = "none";
                
                if (!data || data.length === 0) {
                    galleryEl.innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>まだ投稿がありません。</p>";
                    return;
                }
                
                // (以下、カード生成の処理が続く...)
                data.forEach(item => {
                    const card = document.createElement("div");
                    card.className = "card";
                    
                    let imageUrl = item.imageUrl || "";
                    if (imageUrl.includes("drive.google.com")) {
                        const match = imageUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                        if (match) {
                            imageUrl = `https://lh3.googleusercontent.com/d/${match[1]}`;
                        }
                    }
                    
                    card.innerHTML = `
                        <img src="${imageUrl}" class="card-image" alt="おかず画像" onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
                        <div class="card-content">
                            <div class="meta-info">
                                <span class="nickname">👤 ${item.nickname || '名無しさん'}</span>
                                <span>📅 ${item.date || ''}</span>
                            </div>
                            <span class="food-badge">食材: ${item.foodName || '未指定'}</span>
                            <div class="comment-box">
                                <div class="comment-title">💬 投稿者のコメント</div>
                                <div>${item.registerComment || 'コメントなし'}</div>
                            </div>
                            <div class="comment-box ai-comment">
                                <div class="comment-title" style="color: #047857;">✨ AI応援コメント</div>
                                <div>${item.aiComment || '応援コメント準備中'}</div>
                            </div>
                        </div>
                    `;
                    galleryEl.appendChild(card);
                });
        
            } catch (error) {
                // ③ どこで失敗したかを画面に赤字などでハッキリ表示する
                if (loadingEl) {
                    loadingEl.style.color = "red";
                    loadingEl.textContent = "エラー発生: " + error.message;
                }
                console.error("詳細エラー:", error);
            }
        }

        fetchGalleryData();
    </script>
</body>
</html>
