<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みんなのおかずギャラリー</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f9fa;
            color: #333;
            margin: 0;
            padding-top: 70px; /* 固定ヘッダーの分だけ余白を確保 */
            padding-left: 16px;
            padding-right: 16px;
            padding-bottom: 16px;
        }
        /* 画面上部に固定するヘッダー */
        .fixed-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            box-sizing: border-box;
            z-index: 1000;
        }
        .header-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #d97706;
            margin: 0;
        }
        .close-btn {
            background-color: #f3f4f6;
            color: #374151;
            border: 1px solid #d1d5db;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .close-btn:hover {
            background-color: #e5e7eb;
        }

        .gallery-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .date-divider {
            grid-column: 1 / -1;
            background-color: #fef3c7;
            color: #92400e;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            margin: 20px 0 10px 0;
            border-left: 4px solid #d97706;
        }
        .date-divider:first-of-type {
            margin-top: 0;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #eee;
        }
        .card-content {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }
        .meta-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #666;
        }
        .nickname {
            font-weight: bold;
            color: #333;
        }
        .food-badge {
            background: #fef3c7;
            color: #92400e;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            align-self: flex-start;
        }
        .comment-box {
            background: #f9fafb;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        .comment-title {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 2px;
        }
        .ai-comment {
            background: #ecfdf5;
            color: #065f46;
            border-left: 3px solid #10b981;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        /* ぽよんっと弾むアニメーション */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        .animate-pop {
            animation: pop 0.3s ease-in-out;
        }
    </style>
    <script src="config.js"></script>
</head>
<body>

    <!-- 画面上部に固定するヘッダー ＆ 閉じるボタン -->
    <header class="fixed-header">
        <h1 class="header-title">🍳 みんなのおかずギャラリー</h1>
        <button id="closeBtn" class="close-btn">✕ 閉じる</button>
    </header>

    <div id="loading" class="loading">データを読み込んでいます...</div>
    <div id="gallery" class="gallery-container"></div>

    <script>
        // 日時フォーマット関数
        function formatDateTime(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            if (isNaN(date.getTime())) {
                return dateString.replace('T', ' ').replace(/\.\d+Z$/, '');
            }
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            const hh = String(date.getHours()).padStart(2, '0');
            const min = String(date.getMinutes()).padStart(2, '0');
            return `${yyyy}/${mm}/${dd} ${hh}:${min}`;
        }

        // グループ分け用の日付抽出
        function getDateOnly(dateString) {
            if (!dateString) return '日付不明';
            const date = new Date(dateString);
            if (isNaN(date.getTime())) {
                return dateString.split('T')[0] || '日付不明';
            }
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            return `${yyyy}年${mm}月${dd}日`;
        }

        // ブラウザ識別用IDの取得・生成
        let browserId = localStorage.getItem("browser_id");
        if (!browserId) {
            browserId = 'user_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem("browser_id", browserId);
        }

        async function fetchGalleryData() {
            const galleryEl = document.getElementById("gallery");
            const loadingEl = document.getElementById("loading");
            
            try {
                const response = await fetch(`${GAS_API_URL}?action=gallery`);
                if (!response.ok) {
                    throw new Error(`サーバーエラー: ${response.status} ${response.statusText}`);
                }
                
                const data = await response.json();
                if (loadingEl) loadingEl.style.display = "none";
                
                if (!data || data.length === 0) {
                    galleryEl.innerHTML = "<p style='text-align:center;'>まだ投稿がありません。</p>";
                    return;
                }
                
                galleryEl.innerHTML = "";
                data.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

                let currentGroupDate = "";
                let currentGrid = null;

                data.forEach((item) => {
                    const rawDate = item.date || "";
                    const groupDateStr = getDateOnly(rawDate);
                    const appId = item.applicationId || item.id || ""; // 申込ID

                    if (groupDateStr !== currentGroupDate) {
                        currentGroupDate = groupDateStr;
                        const divider = document.createElement("div");
                        divider.className = "date-divider";
                        divider.textContent = `📅 ${currentGroupDate}`;
                        galleryEl.appendChild(divider);

                        currentGrid = document.createElement("div");
                        currentGrid.className = "gallery-grid";
                        galleryEl.appendChild(currentGrid);
                    }

                    const card = document.createElement("div");
                    card.className = "card";
                    
                    let imageUrl = item.imageUrl || "";
                    if (imageUrl.includes("drive.google.com")) {
                        const match = imageUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                        if (match) {
                            imageUrl = `https://lh3.googleusercontent.com/d/${match[1]}`;
                        }
                    }
                    
                    const rawCheer = item.cheer || ""; 
                    const icons = ["❤️", "👍", "✨", "😋"];
                    const counts = {};
                    icons.forEach(icon => counts[icon] = 0);
                    
                    const cheerEntries = rawCheer ? rawCheer.split(",") : [];
                    cheerEntries.forEach(entry => {
                        const trimmed = entry.trim();
                        if (!trimmed) return;
                        const parts = trimmed.split(":");
                        const icon = parts[0];
                        if (counts[icon] !== undefined) {
                            counts[icon]++;
                        }
                    });

                    // ローカルストレージから自身の選択状態を取得
                    const storageKey = `liked_${appId}`;
                    const myCurrentIcon = localStorage.getItem(storageKey) || "";
                    const formattedDate = formatDateTime(rawDate);

                    card.innerHTML = `
                        <img src="${imageUrl}" class="card-image" alt="おかず画像" onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
                        <div class="card-content">
                            <div class="meta-info">
                                <span class="nickname">👤 ${item.nickname || '名無しさん'}</span>
                                <span>🕒 ${formattedDate}</span>
                            </div>
                            <span class="food-badge">食材: ${item.foodName || '未指定'}</span>
                            <div class="comment-box">
                                <div class="comment-title">💬 投稿者のコメント</div>
                                <div>${item.registerComment || 'コメントなし'}</div>
                            </div>
                            <div class="comment-box ai-comment">
                                <div class="comment-title" style="color: #047857;">✨ AI応援コメント</div>
                                <div>${item.aiComment || '応援コメント準備中'}</div>
                            </div>
                            
                            <div class="cheer-area" style="display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;">
                                ${icons.map(icon => {
                                    const isSelected = (myCurrentIcon === icon);
                                    const bgStyle = isSelected ? "background: #fde68a; border-color: #d97706;" : "background: #f3f4f6; border-color: #e5e7eb;";
                                    return `
                                        <button class="cheer-btn" data-appid="${appId}" data-icon="${icon}" style="cursor: pointer; padding: 4px 10px; border-radius: 20px; border: 1px solid; ${bgStyle} font-size: 0.9rem;">
                                            ${icon} <span class="count">${counts[icon]}</span>
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;

                    // 【オプティミスティックUI】ボタンタップ時の即時反映 ＆ 非同期送信
                    const cheerBtns = card.querySelectorAll(".cheer-btn");
                    cheerBtns.forEach(btn => {
                        btn.addEventListener("click", () => {
                            const clickedIcon = btn.getAttribute("data-icon");
                            let newMyIcon = (myCurrentIcon === clickedIcon) ? "" : clickedIcon;
                            
                            // 1. ローカルストレージを即時更新
                            if (newMyIcon) {
                                localStorage.setItem(storageKey, newMyIcon);
                            } else {
                                localStorage.removeItem(storageKey);
                            }

                            // 2. 画面上の見た目（カウントとボタン背景）を即座に書き換え（アニメーション付き）
                            btn.classList.add("animate-pop");
                            setTimeout(() => btn.classList.remove("animate-pop"), 300);

                            // 一旦再描画してサクサク感を演出するため、簡易的にローカルで数値計算してDOMを更新
                            // （厳密なサーバー同期は裏側のfetchで行う）
                            fetchGalleryData(); 

                            // 3. 裏側（非同期）でGASへ送信
                            let updatedEntries = cheerEntries.filter(entry => !entry.endsWith(":" + browserId));
                            if (newMyIcon) {
                                updatedEntries.push(`${newMyIcon}:${browserId}`);
                            }
                            const newCheerValue = updatedEntries.join(",");

                            fetch(GAS_API_URL.split("?")[0], {
                                method: "POST",
                                headers: { "Content-Type": "text/plain;charset=utf-8" },
                                body: JSON.stringify({
                                    action: "cheer",
                                    applicationId: appId, // 申込IDで安全に更新
                                    cheerValue: newCheerValue
                                })
                            })
                            .then(res => res.json())
                            .then(result => {
                                if (result.status !== "success") {
                                    console.error("保存失敗:", result.message);
                                }
                            })
                            .catch(err => {
                                console.error("通信エラー:", err);
                            });
                        });
                    });

                    currentGrid.appendChild(card);
                });
        
            } catch (error) {
                if (loadingEl) {
                    loadingEl.style.color = "red";
                    loadingEl.textContent = "エラー発生: " + error.message;
                }
                console.error("詳細エラー:", error);
            }
        }

        // 「閉じる」ボタンが押されたときの処理（キャッシュの再整理と画面終了）
        document.getElementById("closeBtn").addEventListener("click", () => {
            // 必要に応じてストレージのクリーンアップや最終同期を実施
            // 例: ウィンドウを閉じる、または前の画面に戻る
            try {
                window.close();
            } catch (e) {
                // ウィンドウが閉じられない環境の場合はリダイレクト等
                alert("キャッシュを保存しました。画面を閉じてください。");
            }
        });

        // 初回データ読み込み
        fetchGalleryData();
    </script>
</body>
</html>
