<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みんなのおかずギャラリー</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f9fa;
            color: #333;
            margin: 0;
            padding: 16px;
        }
        h1 {
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #d97706;
        }
        .gallery-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        /* 日付ごとの区切り帯のスタイル */
        .date-divider {
            grid-column: 1 / -1;
            background-color: #fef3c7;
            color: #92400e;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            margin: 20px 0 10px 0;
            border-left: 4px solid #d97706;
        }
        .date-divider:first-of-type {
            margin-top: 0;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #eee;
        }
        .card-content {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }
        .meta-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #666;
        }
        .nickname {
            font-weight: bold;
            color: #333;
        }
        .food-badge {
            background: #fef3c7;
            color: #92400e;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            align-self: flex-start;
        }
        .comment-box {
            background: #f9fafb;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        .comment-title {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 2px;
        }
        .ai-comment {
            background: #ecfdf5;
            color: #065f46;
            border-left: 3px solid #10b981;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
    <!-- 各HTMLの <head> 内など、他のJSよりも先に読み込む -->
    <script src="config.js"></script>
</head>
<body>

    <h1>🍳 みんなのおかずギャラリー</h1>
    <div id="loading" class="loading">データを読み込んでいます...</div>
    <div id="gallery" class="gallery-container"></div>

    <script>
        // 日時を見やすくフォーマットする関数（例: 2026/10/31 23:48）
        function formatDateTime(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            if (isNaN(date.getTime())) {
                return dateString.replace('T', ' ').replace(/\.\d+Z$/, '');
            }
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            const hh = String(date.getHours()).padStart(2, '0');
            const min = String(date.getMinutes()).padStart(2, '0');
            return `${yyyy}/${mm}/${dd} ${hh}:${min}`;
        }

        // 日付部分（YYYY年MM月DD日）のみを取り出す関数（グループ分け用）
        function getDateOnly(dateString) {
            if (!dateString) return '日付不明';
            const date = new Date(dateString);
            if (isNaN(date.getTime())) {
                return dateString.split('T')[0] || '日付不明';
            }
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            return `${yyyy}年${mm}月${dd}日`;
        }

        async function fetchGalleryData() {
            const galleryEl = document.getElementById("gallery");
            const loadingEl = document.getElementById("loading");
            
            try {
                if (loadingEl) loadingEl.textContent = "Galleryへ接続中...";
                
                const response = await fetch(`${GAS_API_URL}?action=gallery`);
                if (!response.ok) {
                    throw new Error(`サーバーエラー: ${response.status} ${response.statusText}`);
                }
                
                if (loadingEl) loadingEl.textContent = "データを解析中...";
                const data = await response.json();
                
                if (loadingEl) loadingEl.style.display = "none";
                
                if (!data || data.length === 0) {
                    galleryEl.innerHTML = "<p style='text-align:center;'>まだ投稿がありません。</p>";
                    return;
                }
                
                galleryEl.innerHTML = "";
                
                // 申込日時の降順（新しい順）で並び替え
                data.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

                let currentGroupDate = "";
                let currentGrid = null;

                data.forEach((item, index) => {
                    const rawDate = item.date || "";
                    const groupDateStr = getDateOnly(rawDate);

                    // 日付が変わったら新しい帯とグリッドコンテナを作成
                    if (groupDateStr !== currentGroupDate) {
                        currentGroupDate = groupDateStr;

                        const divider = document.createElement("div");
                        divider.className = "date-divider";
                        divider.textContent = `📅 ${currentGroupDate}`;
                        galleryEl.appendChild(divider);

                        currentGrid = document.createElement("div");
                        currentGrid.className = "gallery-grid";
                        galleryEl.appendChild(currentGrid);
                    }

                    const card = document.createElement("div");
                    card.className = "card";
                    
                    let imageUrl = item.imageUrl || "";
                    if (imageUrl.includes("drive.google.com")) {
                        const match = imageUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                        if (match) {
                            imageUrl = `https://lh3.googleusercontent.com/d/${match[1]}`;
                        }
                    }
                    
                    const rawCheer = item.cheer || ""; 
                    const icons = ["❤️", "👍", "✨", "😋"];
                    const counts = {};
                    icons.forEach(icon => counts[icon] = 0);
                    
                    const cheerEntries = rawCheer ? rawCheer.split(",") : [];
                    cheerEntries.forEach(entry => {
                        const trimmed = entry.trim();
                        if (!trimmed) return;
                        const parts = trimmed.split(":");
                        const icon = parts[0];
                        if (counts[icon] !== undefined) {
                            counts[icon]++;
                        }
                    });

                    const originalIndex = data.indexOf(item);
                    const storageKey = `liked_post_${originalIndex}`;
                    const myCurrentIcon = localStorage.getItem(storageKey) || "";

                    const formattedDate = formatDateTime(rawDate);

                    card.innerHTML = `
                        <img src="${imageUrl}" class="card-image" alt="おかず画像" onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
                        <div class="card-content">
                            <div class="meta-info">
                                <span class="nickname">👤 ${item.nickname || '名無しさん'}</span>
                                <span>🕒 ${formattedDate}</span>
                            </div>
                            <span class="food-badge">食材: ${item.foodName || '未指定'}</span>
                            <div class="comment-box">
                                <div class="comment-title">💬 投稿者のコメント</div>
                                <div>${item.registerComment || 'コメントなし'}</div>
                            </div>
                            <div class="comment-box ai-comment">
                                <div class="comment-title" style="color: #047857;">✨ AI応援コメント</div>
                                <div>${item.aiComment || '応援コメント準備中'}</div>
                            </div>
                            
                            <!-- いいね（アイコン選択）ボタンエリア -->
                            <div class="cheer-area" style="display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;">
                                ${icons.map(icon => {
                                    const isSelected = (myCurrentIcon === icon);
                                    const bgStyle = isSelected ? "background: #fde68a; border-color: #d97706;" : "background: #f3f4f6; border-color: #e5e7eb;";
                                    return `
                                        <button class="cheer-btn" data-row="${originalIndex + 2}" data-icon="${icon}" style="cursor: pointer; padding: 4px 10px; border-radius: 20px; border: 1px solid; ${bgStyle} font-size: 0.9rem;">
                                            ${icon} <span class="count">${counts[icon]}</span>
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;

                    // ボタンをクリックしたときの処理
                    const cheerBtns = card.querySelectorAll(".cheer-btn");
                    cheerBtns.forEach(btn => {
                        btn.addEventListener("click", async () => {
                            const rowIndex = btn.getAttribute("data-row");
                            const clickedIcon = btn.getAttribute("data-icon");
                            
                            let newMyIcon = "";
                            if (myCurrentIcon === clickedIcon) {
                                newMyIcon = ""; 
                            } else {
                                newMyIcon = clickedIcon; 
                            }
                            
                            if (newMyIcon) {
                                localStorage.setItem(storageKey, newMyIcon);
                            } else {
                                localStorage.removeItem(storageKey);
                            }
                            
                            let browserId = localStorage.getItem("browser_id");
                            if (!browserId) {
                                browserId = 'user_' + Math.random().toString(36).substring(2, 9);
                                localStorage.setItem("browser_id", browserId);
                            }
                            
                            let updatedEntries = cheerEntries.filter(entry => !entry.endsWith(":" + browserId));
                            if (newMyIcon) {
                                updatedEntries.push(`${newMyIcon}:${browserId}`);
                            }
                            
                            const newCheerValue = updatedEntries.join(",");
                            
                            btn.style.opacity = "0.5";
                            
                            try {
                                const response = await fetch(GAS_API_URL.split("?")[0], {
                                    method: "POST",
                                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                                    body: JSON.stringify({
                                        action: "cheer",
                                        rowIndex: Number(rowIndex),
                                        cheerValue: newCheerValue
                                    })
                                });
                                
                                const result = await response.json();
                                if (result.status === "success") {
                                    fetchGalleryData(); 
                                } else {
                                    alert("保存に失敗しました: " + result.message);
                                }
                            } catch (err) {
                                console.error("通信エラー:", err);
                                alert("通信に失敗しました。");
                            } finally {
                                btn.style.opacity = "1";
                            }
                        });
                    });

                    currentGrid.appendChild(card);
                });
        
            } catch (error) {
                if (loadingEl) {
                    loadingEl.style.color = "red";
                    loadingEl.textContent = "エラー発生: " + error.message;
                }
                console.error("詳細エラー:", error);
            }
        }

        fetchGalleryData();
    </script>
</body>
</html>
