<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みんなのおかずギャラリー</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f9fa;
            color: #333;
            margin: 0;
            padding: 16px;
        }
        h1 {
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #d97706;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #eee;
        }
        .card-content {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }
        .meta-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #666;
        }
        .nickname {
            font-weight: bold;
            color: #333;
        }
        .food-badge {
            background: #fef3c7;
            color: #92400e;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            align-self: flex-start;
        }
        .comment-box {
            background: #f9fafb;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        .comment-title {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 2px;
        }
        .ai-comment {
            background: #ecfdf5;
            color: #065f46;
            border-left: 3px solid #10b981;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>

    <h1>🍳 みんなのおかずギャラリー</h1>
    <div id="loading" class="loading">データを読み込んでいます...</div>
    <div id="gallery" class="gallery-grid"></div>
<script>
        // デプロイしたGASのWebアプリURLに ?action=gallery をつなげたもの
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxwJRr29h2E1pQRWeOA6bogXm50OhJbbnCESS_EWyd-UhKXTc8u_JUht4nYRGESzKVi/exec?action=gallery";

        async function fetchGalleryData() {
            const galleryEl = document.getElementById("gallery");
            const loadingEl = document.getElementById("loading");
            
            try {
                if (loadingEl) loadingEl.textContent = "GASへ接続中...";
                
                const response = await fetch(GAS_API_URL);
                if (!response.ok) {
                    throw new Error(`サーバーエラー: ${response.status} ${response.statusText}`);
                }
                
                if (loadingEl) loadingEl.textContent = "データを解析中...";
                const data = await response.json();
                
                if (loadingEl) loadingEl.style.display = "none";
                
                if (!data || data.length === 0) {
                    galleryEl.innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>まだ投稿がありません。</p>";
                    return;
                }
                
                // データをクリアして再描画時に重複しないようにする
                galleryEl.innerHTML = "";
                
                data.forEach((item, index) => {
                    const card = document.createElement("div");
                    card.className = "card";
                    
                    let imageUrl = item.imageUrl || "";
                    if (imageUrl.includes("drive.google.com")) {
                        const match = imageUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                        if (match) {
                            imageUrl = `https://lh3.googleusercontent.com/d/${match[1]}`;
                        }
                    }
                    
                    // スプレッドシートのチアー列（O列のデータ）を生データとして取得
                    const rawCheer = item.cheer || ""; 
                    
                    // 利用するアイコンの定義
                    const icons = ["❤️", "👍", "✨", "😋"];
                    const counts = {};
                    icons.forEach(icon => counts[icon] = 0);
                    
                    // カンマ区切りの文字列からカウントを復元
                    const cheerEntries = rawCheer ? rawCheer.split(",") : [];
                    cheerEntries.forEach(entry => {
                        const parts = entry.split(":");
                        const icon = parts[0];
                        if (counts[icon] !== undefined) {
                            counts[icon]++;
                        }
                    });

                    // このブラウザ（ユーザー）が既に押しているアイコンをローカルストレージから取得
                    const storageKey = `liked_post_${index}`;
                    const myCurrentIcon = localStorage.getItem(storageKey) || "";

                    // カードHTMLの構築
                    card.innerHTML = `
                        <img src="${imageUrl}" class="card-image" alt="おかず画像" onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
                        <div class="card-content">
                            <div class="meta-info">
                                <span class="nickname">👤 ${item.nickname || '名無しさん'}</span>
                                <span>📅 ${item.date || ''}</span>
                            </div>
                            <span class="food-badge">食材: ${item.foodName || '未指定'}</span>
                            <div class="comment-box">
                                <div class="comment-title">💬 投稿者のコメント</div>
                                <div>${item.registerComment || 'コメントなし'}</div>
                            </div>
                            <div class="comment-box ai-comment">
                                <div class="comment-title" style="color: #047857;">✨ AI応援コメント</div>
                                <div>${item.aiComment || '応援コメント準備中'}</div>
                            </div>
                            
                            <!-- いいね（アイコン選択）ボタンエリア -->
                            <div class="cheer-area" style="display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;">
                                ${icons.map(icon => {
                                    const isSelected = (myCurrentIcon === icon);
                                    const bgStyle = isSelected ? "background: #fde68a; border-color: #d97706;" : "background: #f3f4f6; border-color: #e5e7eb;";
                                    return `
                                        <button class="cheer-btn" data-row="${index + 2}" data-icon="${icon}" style="cursor: pointer; padding: 4px 10px; border-radius: 20px; border: 1px solid; ${bgStyle} font-size: 0.9rem;">
                                            ${icon} <span class="count">${counts[icon]}</span>
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;

                    // ボタンをクリックしたときの処理（トグル・取り消し・保存対応）
                    const cheerBtns = card.querySelectorAll(".cheer-btn");
                    cheerBtns.forEach(btn => {
                        btn.addEventListener("click", async () => {
                            const rowIndex = btn.getAttribute("data-row");
                            const clickedIcon = btn.getAttribute("data-icon");
                            
                            let newMyIcon = "";
                            if (myCurrentIcon === clickedIcon) {
                                newMyIcon = ""; // 同じものを押したら解除
                            } else {
                                newMyIcon = clickedIcon; // 新しく選んだ、または変更
                            }
                            
                            if (newMyIcon) {
                                localStorage.setItem(storageKey, newMyIcon);
                            } else {
                                localStorage.removeItem(storageKey);
                            }
                            
                            // ブラウザ識別IDの取得・生成
                            let browserId = localStorage.getItem("browser_id");
                            if (!browserId) {
                                browserId = 'user_' + Math.random().toString(36).substring(2, 9);
                                localStorage.setItem("browser_id", browserId);
                            }
                            
                            let updatedEntries = cheerEntries.filter(entry => !entry.endsWith(":" + browserId));
                            if (newMyIcon) {
                                updatedEntries.push(`${newMyIcon}:${browserId}`);
                            }
                            
                            const newCheerValue = updatedEntries.join(",");
                            
                            btn.style.opacity = "0.5";
                            
                            try {
                                const response = await fetch(GAS_API_URL.split("?")[0], {
                                    method: "POST",
                                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                                    body: JSON.stringify({
                                        action: "cheer",
                                        rowIndex: Number(rowIndex),
                                        cheerValue: newCheerValue
                                    })
                                });
                                
                                const result = await response.json();
                                if (result.status === "success") {
                                    fetchGalleryData(); // 最新データに再描画
                                } else {
                                    alert("保存に失敗しました: " + result.message);
                                }
                            } catch (err) {
                                console.error("通信エラー:", err);
                                alert("通信に失敗しました。");
                            } finally {
                                btn.style.opacity = "1";
                            }
                        });
                    });

                    galleryEl.appendChild(card);
                });
        
            } catch (error) {
                if (loadingEl) {
                    loadingEl.style.color = "red";
                    loadingEl.textContent = "エラー発生: " + error.message;
                }
                console.error("詳細エラー:", error);
            }
        }
        fetchGalleryData();
    </script>
</body>
</html>
