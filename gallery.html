<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みんなのおかずギャラリー</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f9fa;
            color: #333;
            margin: 0;
            padding-top: 70px;
            padding-left: 16px;
            padding-right: 16px;
            padding-bottom: 70px;
        }
        .fixed-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            box-sizing: border-box;
            z-index: 1000;
        }
        .header-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #d97706;
            margin: 0;
        }
        .gallery-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .date-divider {
            grid-column: 1 / -1;
            background-color: #fef3c7;
            color: #92400e;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            margin: 20px 0 10px 0;
            border-left: 4px solid #d97706;
        }
        .date-divider:first-of-type {
            margin-top: 0;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #eee;
        }
        .card-content {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }
        .meta-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.80rem;
            color: #666;
        }
        .nickname {
            font-weight: bold;
            color: #333;
        }
        .food-badge {
            background: #fef3c7;
            color: #92400e;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            align-self: flex-start;
        }
        .comment-box {
            background: #f9fafb;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        .comment-title {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 2px;
        }
        .ai-comment {
            background: #ecfdf5;
            color: #065f46;
            border-left: 3px solid #10b981;
        }

        .loading-container {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #d97706;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .cheer-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid;
            font-size: 0.9rem;
            background-color: #f3f4f6;
            border-color: #e5e7eb;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .debug-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #f3f4f6;
            border-top: 1px solid #e5e7eb;
            font-size: 0.75rem;
            color: #4b5563;
            padding: 8px 12px;
            box-sizing: border-box;
            z-index: 999;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            transition: opacity 0.8s ease;
        }
        .debug-footer::-webkit-scrollbar {
            height: 5px;
        }
        .debug-footer::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 3px;
        }
    </style>
    <script src="config.js"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

    <header class="fixed-header">
        <h1 class="header-title">🍳 みんなのおかずギャラリー</h1>
    </header>

    <div id="loading" class="loading-container">
        <div class="spinner"></div>
        <div style="font-weight: bold; color: #b45309;">データを読み込んでいます...</div>
        <div style="font-size: 0.8rem; color: #888; margin-top: 4px;">画像検索に少し時間がかかる場合があります</div>
    </div>

    <div id="gallery" class="gallery-container"></div>

    <div id="debugFooter" class="debug-footer"></div>

    <script>
        const footerEl = document.getElementById("debugFooter");
        footerEl.textContent = "API: " + (typeof GAS_API_URL !== "undefined" ? GAS_API_URL : "未定義");

        setTimeout(() => {
            footerEl.scrollLeft = footerEl.scrollWidth;
        }, 100);

        setTimeout(() => {
            footerEl.style.opacity = "0";
            setTimeout(() => {
                footerEl.style.display = "none";
            }, 800);
        }, 10000);

        function formatDateTime(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            if (isNaN(date.getTime())) {
                return dateString.replace('T', ' ').replace(/\.\d+Z$/, '');
            }
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            const hh = String(date.getHours()).padStart(2, '0');
            const min = String(date.getMinutes()).padStart(2, '0');
            return `${yyyy}/${mm}/${dd} ${hh}:${min}`;
        }

        function getDateOnly(dateString) {
            if (!dateString) return '日付不明';
            const date = new Date(dateString);
            if (isNaN(date.getTime())) {
                return dateString.split('T')[0] || '日付不明';
            }
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            return `${yyyy}年${mm}月${dd}日`;
        }

        let browserId = localStorage.getItem("browser_id");
        if (!browserId) {
            browserId = 'user_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem("browser_id", browserId);
        }

        // 自動リトライ機能付きのデータ取得関数（最大3回挑戦）
        async function fetchGalleryData(isBackground = false, retryCount = 0) {
            const galleryEl = document.getElementById("gallery");
            const loadingEl = document.getElementById("loading");
            const maxRetries = 3; 
            
            try {
                if (!isBackground && loadingEl) {
                    loadingEl.style.display = "block";
                    // リトライ中（2回目以降）の場合にメッセージを切り替える
                    if (retryCount > 0) {
                        loadingEl.innerHTML = `
                            <div class="spinner"></div>
                            <div style="font-weight: bold; color: #b45309;">サーバーを起動しています... (${retryCount}/${maxRetries}回目)</div>
                            <div style="font-size: 0.8rem; color: #888; margin-top: 4px;">スリープからの復帰に少し時間がかかっています</div>
                        `;
                    }
                }
                
                // ⏱️ 8秒でタイムアウトさせるコントローラー
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);

                const response = await fetch(`${GAS_API_URL}?action=gallery`, {
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId); // 間に合ったらタイマー解除

                if (!response.ok) {
                    throw new Error(`サーバーエラー: ${response.status} ${response.statusText}`);
                }
                
                const data = await response.json();
                if (!isBackground && loadingEl) loadingEl.style.display = "none";
                
                if (!data || data.length === 0) {
                    if (!isBackground) galleryEl.innerHTML = "<p style='text-align:center;'>まだ投稿がありません。</p>";
                    return;
                }
                
                if (isBackground && galleryEl.children.length > 0) {
                    return; 
                }
                
                galleryEl.innerHTML = "";
                data.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

                let currentGroupDate = "";
                let currentGrid = null;

                data.forEach((item) => {
                    const rawDate = item.date || "";
                    const groupDateStr = getDateOnly(rawDate);
                    const appId = item.applicationId || ""; 

                    if (groupDateStr !== currentGroupDate) {
                        currentGroupDate = groupDateStr;
                        const divider = document.createElement("div");
                        divider.className = "date-divider";
                        divider.textContent = `📅 ${currentGroupDate}`;
                        galleryEl.appendChild(divider);

                        currentGrid = document.createElement("div");
                        currentGrid.className = "gallery-grid";
                        galleryEl.appendChild(currentGrid);
                    }

                    const card = document.createElement("div");
                    card.className = "card";
                    
                    let imageUrl = item.imageUrl || "";
                    if (imageUrl.includes("drive.google.com")) {
                        const match = imageUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                        if (match) {
                            imageUrl = `https://lh3.googleusercontent.com/d/${match[1]}`;
                        }
                    }
                    
                    const rawCheer = item.cheer || ""; 
                    const icons = ["❤️", "👍", "✨", "😋"];
                    
                    let counts = {};
                    icons.forEach(icon => counts[icon] = 0);
                    
                    let cheerEntries = rawCheer ? rawCheer.split(",").map(e => e.trim()).filter(Boolean) : [];
                    let myCurrentIcon = "";
                    
                    cheerEntries.forEach(entry => {
                        const parts = entry.split(":");
                        const icon = parts[0];
                        const uid = parts[1];
                        
                        if (counts[icon] !== undefined) {
                            counts[icon]++;
                        }
                        if (uid === browserId) {
                            myCurrentIcon = icon;
                        }
                    });

                    const formattedDate = formatDateTime(rawDate);

                    card.innerHTML = `
                        <img src="${imageUrl}" class="card-image" alt="おかず画像" onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
                        <div class="card-content">
                            <div class="meta-info">
                                <span class="nickname">👤 ${item.nickname || '名無しさん'}</span>
                                <span>🕒 ${formattedDate}</span>
                            </div>
                            <span class="food-badge">食材: ${item.foodName || '未指定'}</span>
                            <div class="comment-box">
                                <div class="comment-title">💬 投稿者のコメント</div>
                                <div>${item.registerComment || 'コメントなし'}</div>
                            </div>
                            <div class="comment-box ai-comment">
                                <div class="comment-title" style="color: #047857;">✨ AIありがとうコメント</div>
                                <div>${item.aiComment || 'AIコメント準備中'}</div>
                            </div>
                            
                            <div class="cheer-area" style="display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;">
                                ${icons.map(icon => {
                                    const isSelected = (myCurrentIcon === icon);
                                    const bgStyle = isSelected ? "background: #fde68a; border-color: #d97706;" : "background: #f3f4f6; border-color: #e5e7eb;";
                                    return `
                                        <button class="cheer-btn" data-appid="${appId}" data-icon="${icon}" style="${bgStyle}">
                                            ${icon} <span class="count">${counts[icon]}</span>
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;

                    const cheerBtns = card.querySelectorAll(".cheer-btn");
                    cheerBtns.forEach(btn => {
                        btn.addEventListener("click", () => {
                            const clickedIcon = btn.getAttribute("data-icon");
                            
                            let filteredEntries = cheerEntries.filter(entry => {
                                const parts = entry.split(":");
                                return parts[1] !== browserId;
                            });

                            if (myCurrentIcon === clickedIcon) {
                                counts[clickedIcon] = Math.max(0, counts[clickedIcon] - 1);
                                myCurrentIcon = "";
                            } else {
                                if (myCurrentIcon && counts[myCurrentIcon] > 0) {
                                    counts[myCurrentIcon] = Math.max(0, counts[myCurrentIcon] - 1);
                                }
                                counts[clickedIcon] = (counts[clickedIcon] || 0) + 1;
                                myCurrentIcon = clickedIcon;
                                filteredEntries.push(`${clickedIcon}:${browserId}`);
                            }

                            cheerEntries = filteredEntries;
                            const newCheerValue = cheerEntries.join(",");

                            cheerBtns.forEach(b => {
                                const bIcon = b.getAttribute("data-icon");
                                const countSpan = b.querySelector(".count");
                                countSpan.textContent = counts[bIcon];
                                
                                if (bIcon === myCurrentIcon) {
                                    b.style.background = "#fde68a";
                                    b.style.borderColor = "#d97706";
                                } else {
                                    b.style.background = "#f3f4f6";
                                    b.style.borderColor = "#e5e7eb";
                                }
                            });

                            fetch(GAS_API_URL.split("?")[0], {
                                method: "POST",
                                headers: { "Content-Type": "text/plain;charset=utf-8" },
                                body: JSON.stringify({
                                    action: "cheer",
                                    applicationId: appId,
                                    cheerValue: newCheerValue
                                })
                            })
                            .then(res => res.json())
                            .then(result => {})
                            .catch(err => {
                                console.error("通信エラー:", err);
                            });
                        });
                    });

                    currentGrid.appendChild(card);
                });
        
            } catch (error) {
                console.warn(`試行 ${retryCount + 1} 回目でタイムアウト/エラー発生:`, error.message);

                // まだリトライ回数が残っている場合は 1.5秒後に自動リトライ
                if (!isBackground && retryCount < maxRetries) {
                    const nextRetry = retryCount + 1;
                    setTimeout(() => {
                        fetchGalleryData(false, nextRetry);
                    }, 1500);
                    return;
                }

                // すべてのリトライが失敗した場合のエラー表示
                if (!isBackground && loadingEl) {
                    loadingEl.style.color = "d97706";
                    loadingEl.innerHTML = `
                        <div style='font-weight:bold; color:#b45309;'>⚠️ サーバーの起動に時間がかかっています</div>
                        <div style='font-size:0.85rem; margin-top:8px; color:#666;'>サーバーがスリープ状態から復帰するのに時間がかかっているようです。</div>
                        <button onclick="location.reload()" style="margin-top:14px; padding:6px 16px; background:#d97706; color:#fff; border:none; border-radius:20px; font-weight:bold; cursor:pointer;">もう一度読み込む</button>
                    `;
                }
            }
        }

        // 初回ロード実行
        fetchGalleryData(false, 0);
    </script>
</body>
</html>
